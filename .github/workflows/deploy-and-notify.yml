name: CI Deploy & Notify

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # repository_dispatch (the notify step) needs contents: write
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm ci
      - name: Build assets
        run: |
          npm run build
      - name: Install function dependencies
        run: |
          npm ci --prefix functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.29.1
      # Uses the FIREBASE_TOKEN repo secret. If deploy fails with an auth
      # error, the token is expired — refresh it with `firebase login:ci`
      # and update the secret's value.
      - name: Firebase Deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting,functions --project expense-tracker-prod-df355 --non-interactive
      # Non-fatal: a smoke-test notification failure must not mark a
      # successful deploy as failed.
      - name: Notify smoke workflow (repository_dispatch)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOSTING_URL: https://expense-tracker-prod-df355.web.app
          DEPLOY_ID: ${{ github.sha }}
        run: |
          node scripts/notify-github-deploy.js
