name: CI Deploy & Notify

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm ci
      - name: Build assets
        run: |
          npm run build
      - name: Install function dependencies
        run: |
          npm ci --prefix functions
      # Authenticate with the service account created by
      # `firebase init hosting:github` (replaces the deprecated
      # FIREBASE_TOKEN). The action exports GOOGLE_APPLICATION_CREDENTIALS,
      # which firebase-tools picks up.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXPENSE_TRACKER_PROD_DF355 }}'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.29.1
      # Hosting only: the service account from `firebase init hosting:github`
      # has hosting permissions but not Cloud Functions. To also deploy
      # functions here, grant the SA roles/cloudfunctions.admin +
      # roles/iam.serviceAccountUser, then change this to hosting,functions.
      - name: Firebase Deploy
        run: firebase deploy --only hosting --project expense-tracker-prod-df355 --non-interactive
      - name: Notify smoke workflow (repository_dispatch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOSTING_URL: https://expense-tracker-prod-df355.web.app
          DEPLOY_ID: ${{ github.sha }}
        run: |
          node scripts/notify-github-deploy.js
